name: Deploy FEMUCARIBE to ICDSoft WebApps

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm deployment to www.femucaribe.go.cr
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: femucaribe-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.confirm_production)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ICDSOFT_HOST: ${{ vars.ICDSOFT_HOST }}
      ICDSOFT_PORT: ${{ vars.ICDSOFT_PORT }}
      ICDSOFT_USER: ${{ vars.ICDSOFT_USER }}
      ICDSOFT_DEPLOY_ROOT: ${{ vars.ICDSOFT_DEPLOY_ROOT }}
      ICDSOFT_WEBAPP: ${{ vars.ICDSOFT_WEBAPP }}
      ICDSOFT_SITE_URL: ${{ vars.ICDSOFT_SITE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate application
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run test:unit
          pnpm exec prettier --check .github/workflows/deploy-webapps.yml docs/agents/WEBAPPS-DEPLOYMENT.md

      - name: Build Astro server
        run: pnpm run build

      - name: Keep production dependencies
        run: pnpm install --prod --frozen-lockfile

      - name: Package release
        run: |
          set -euo pipefail
          test -f dist/server/entry.mjs
          mkdir -p .deployment-package/data
          cp -a dist node_modules package.json .deployment-package/
          cp data/municipalities-data.json .deployment-package/data/municipalities-data.json
          printf '[]\n' > .deployment-package/data/documents-manifest.json
          tar -C .deployment-package -czf release.tar.gz .

      - name: Upload release and restart WebApps
        shell: bash
        env:
          ICDSOFT_SSH_PRIVATE_KEY: ${{ secrets.ICDSOFT_SSH_PRIVATE_KEY }}
          ICDSOFT_SSH_KNOWN_HOSTS: ${{ secrets.ICDSOFT_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          : "${ICDSOFT_HOST:?Add the ICDSOFT_HOST Actions variable}"
          : "${ICDSOFT_PORT:?Add the ICDSOFT_PORT Actions variable}"
          : "${ICDSOFT_USER:?Add the ICDSOFT_USER Actions variable}"
          : "${ICDSOFT_DEPLOY_ROOT:?Add the ICDSOFT_DEPLOY_ROOT Actions variable}"
          : "${ICDSOFT_WEBAPP:?Add the ICDSOFT_WEBAPP Actions variable}"
          : "${ICDSOFT_SITE_URL:?Add the ICDSOFT_SITE_URL Actions variable}"
          : "${ICDSOFT_SSH_PRIVATE_KEY:?Add the ICDSOFT_SSH_PRIVATE_KEY Actions secret}"
          : "${ICDSOFT_SSH_KNOWN_HOSTS:?Add the ICDSOFT_SSH_KNOWN_HOSTS Actions secret}"

          if [[ ! "$ICDSOFT_HOST" =~ ^[A-Za-z0-9][A-Za-z0-9.-]*$ ]]; then
            echo "ICDSOFT_HOST must be a server hostname."
            exit 1
          fi
          if [[ ! "$ICDSOFT_PORT" =~ ^[0-9]{1,5}$ ]] || (( 10#$ICDSOFT_PORT < 1 || 10#$ICDSOFT_PORT > 65535 )); then
            echo "ICDSOFT_PORT must be between 1 and 65535."
            exit 1
          fi
          if [[ ! "$ICDSOFT_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "ICDSOFT_USER contains unsupported characters."
            exit 1
          fi
          if [[ ! "$ICDSOFT_DEPLOY_ROOT" =~ ^/home/[A-Za-z0-9._/-]+/private/[A-Za-z0-9._/-]+$ || "$ICDSOFT_DEPLOY_ROOT" == *".."* ]]; then
            echo "ICDSOFT_DEPLOY_ROOT must be a path inside the hosting account's private directory."
            exit 1
          fi
          if [[ ! "$ICDSOFT_WEBAPP" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "ICDSOFT_WEBAPP contains unsupported characters."
            exit 1
          fi
          if [[ ! "$ICDSOFT_SITE_URL" =~ ^https://[^/]+$ ]]; then
            echo "ICDSOFT_SITE_URL must be the HTTPS origin, without a trailing slash or path."
            exit 1
          fi

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$ICDSOFT_SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/icdsoft_deploy"
          printf '%s\n' "$ICDSOFT_SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/icdsoft_deploy" "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/icdsoft_deploy" >/dev/null

          ssh_options=(-p "$ICDSOFT_PORT" -i "$HOME/.ssh/icdsoft_deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes)
          remote="$ICDSOFT_USER@$ICDSOFT_HOST"
          incoming="$ICDSOFT_DEPLOY_ROOT/releases/.incoming-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.tar.gz"

          ssh "${ssh_options[@]}" "$remote" "mkdir -p '$ICDSOFT_DEPLOY_ROOT/releases' '$ICDSOFT_DEPLOY_ROOT/data'"
          printf 'put release.tar.gz %s\n' "$incoming" | sftp -P "$ICDSOFT_PORT" -i "$HOME/.ssh/icdsoft_deploy" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes -b - "$remote"

          ssh "${ssh_options[@]}" "$remote" bash -s -- "$ICDSOFT_DEPLOY_ROOT" "$ICDSOFT_WEBAPP" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" <<'REMOTE'
          set -euo pipefail
          base="$1"
          app="$2"
          sha="$3"
          run_id="$4"
          attempt="$5"
          release_id="${sha}-${run_id}-${attempt}"
          archive="$base/releases/.incoming-${run_id}-${attempt}.tar.gz"
          stage="$base/releases/.staging-${release_id}"
          release="$base/releases/${release_id}"

          mkdir "$stage"
          trap 'rm -rf -- "$stage"' EXIT
          tar -xzf "$archive" -C "$stage"
          test -f "$stage/dist/server/entry.mjs"
          test -d "$stage/node_modules"
          test -f "$stage/data/municipalities-data.json"
          test -f "$stage/data/documents-manifest.json"

          if [ ! -e "$base/data/municipalities-data.json" ]; then
            install -m 600 "$stage/data/municipalities-data.json" "$base/data/municipalities-data.json"
          fi
          if [ ! -e "$base/data/documents-manifest.json" ]; then
            install -m 600 "$stage/data/documents-manifest.json" "$base/data/documents-manifest.json"
          fi

          mv "$stage" "$release"
          trap - EXIT
          ln -s "$release" "$base/.current-${run_id}-${attempt}"
          mv -Tf "$base/.current-${run_id}-${attempt}" "$base/current"

          sureapp service manage --stop "$app" || true
          sureapp service manage --enable "$app"
          sureapp service manage --start "$app"
          rm -f "$archive"
          REMOTE

      - name: Smoke test production routes
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 --max-time 15 "$ICDSOFT_SITE_URL/" --output /dev/null
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 5 --max-time 15 "$ICDSOFT_SITE_URL/municipalidades" --output /dev/null
