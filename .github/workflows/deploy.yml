name: Deploy FEMUCARIBE to Shared Hosting

on:
  push:
    branches:
      - main
  repository_dispatch:
    types:
      - cms-content-update
  workflow_dispatch:
    inputs:
      confirm_production:
        description: Confirm deployment to production
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: femucaribe-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'repository_dispatch' || inputs.confirm_production)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      HOSTING_HOST: ${{ vars.HOSTING_HOST }}
      HOSTING_PORT: ${{ vars.HOSTING_PORT }}
      HOSTING_USER: ${{ vars.HOSTING_USER }}
      HOSTING_WEB_ROOT: ${{ vars.HOSTING_WEB_ROOT }}
      HOSTING_SITE_URL: ${{ vars.HOSTING_SITE_URL }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate application
        run: |
          pnpm run typecheck
          pnpm run lint:js
          pnpm run test:unit

      - name: Build static site
        run: pnpm run build

      - name: Package static artifact only
        run: |
          set -euo pipefail
          test -d dist/client
          test -f dist/client/index.html
          (cd dist/client && tar -czf ../../static-artifact.tar.gz .)

      - name: Upload and deploy artifact to hosting
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTING_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.HOSTING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          : "${HOSTING_HOST:?Add the HOSTING_HOST Actions variable}"
          : "${HOSTING_PORT:?Add the HOSTING_PORT Actions variable}"
          : "${HOSTING_USER:?Add the HOSTING_USER Actions variable}"
          : "${HOSTING_WEB_ROOT:?Add the HOSTING_WEB_ROOT Actions variable}"
          : "${HOSTING_SITE_URL:?Add the HOSTING_SITE_URL Actions variable}"
          : "${SSH_PRIVATE_KEY:?Add the HOSTING_SSH_PRIVATE_KEY Actions secret}"
          : "${SSH_KNOWN_HOSTS:?Add the HOSTING_SSH_KNOWN_HOSTS Actions secret}"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" | tr -d '\r' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

          ssh_options=(-p "$HOSTING_PORT" -i "$HOME/.ssh/deploy_key" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes)
          remote="$HOSTING_USER@$HOSTING_HOST"

          # Desplegar artefacto estático directamente al web root vía SSH stream
          ssh "${ssh_options[@]}" "$remote" "mkdir -p '$HOSTING_WEB_ROOT' && tar --no-overwrite-dir --no-same-permissions --no-same-owner -xzf - -C '$HOSTING_WEB_ROOT'" < static-artifact.tar.gz

      - name: Smoke test production routes
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 15 "$HOSTING_SITE_URL/" --output /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 15 "$HOSTING_SITE_URL/noticias" --output /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 15 "$HOSTING_SITE_URL/municipalidades" --output /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 15 "$HOSTING_SITE_URL/favicon.ico" --output /dev/null
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 3 --max-time 15 "$HOSTING_SITE_URL/media/municipalidades/canton-limon.png" --output /dev/null
